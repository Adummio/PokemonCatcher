name: .NET CI

# Definisce quando deve partire l'azione
on:
  push:
    branches: 
      - main
      - develop
  pull_request:
    branches: 
      - main
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest # Usa Linux per velocità e costi inferiori

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # Assicurati che corrisponda alla versione che usi (8.0 o 9.0)

    - name: Ripristino dipendenze (Restore)
      run: dotnet restore

    - name: Compilazione (Build)
      run: dotnet build --no-restore --configuration Release

    - name: Esecuzione Test
      run: dotnet test --no-build --configuration Release --verbosity normal